name: Build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [barber, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p android/${{ matrix.app }} assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: android/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
