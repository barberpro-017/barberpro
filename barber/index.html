 $('#chg').innerHTML=C.map(c=>`<div class="card cl" data-a="wd|${c[0]}"><b>${c[1]}</b><div class="cw"><canvas id="cv_${c[0]}"></canvas></div><div class="mu" style="text-align:right">To'liq ko'rish ›</div></div>`).join('');
 C.forEach(c=>chartsB.push(mkChart($('#cv_'+c[0]),c,false)))}
const OSTB={yangi:'🆕 Yangi',yetkazilmoqda:'🚚 Yetkazilmoqda',yetkazildi:'✅ Yetkazildi',bekor:'❌ Bekor'};
const fdtB=d=>new Date(d).toLocaleString('uz',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const leftTxt=m=>m>=1440?Math.floor(m/1440)+' kun'+(m%1440?' '+durTxt(m%1440):''):durTxt(m);
function etaTxt(o){if(o.status==='yangi')return '⏳ Yetkazish vaqti belgilanishi kutilmoqda';
 if(o.status==='yetkazilmoqda'&&o.delivery_at){const m=Math.round((new Date(o.delivery_at)-Date.now())/60000);return `🚚 ${fdtB(o.delivery_at)} · ${m>0?'taxminan '+leftTxt(m)+'dan so\'ng':'yaqin orada yetib keladi'}`}
 return o.status==='yetkazildi'?'✅ Yetkazib berildi':''}
async function loadStore(){try{const [p,o]=await Promise.all([call('products'),call('orders')]);PROD=p.products||[];ORD=o.orders||[];draw()}catch(e){}}
function prodGrid(){let L=PROD.filter(p=>(!stCat||p.category===stCat)&&(!stQ||p.name.toLowerCase().includes(stQ.toLowerCase())));
 L=L.slice().sort(stSort==='cheap'?(a,b)=>a.price-b.price:stSort==='pricey'?(a,b)=>b.price-a.price:(a,b)=>new Date(b.created_at)-new Date(a.created_at));
 return L.length?L.map(p=>{const nw=Date.now()-new Date(p.created_at)<7*864e5;
  return `<div class="pc"><div class="pi" data-a="pv|${p.id}">${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" alt="">`:'🧴'}${nw?'<span class="nw">Yangi</span>':''}</div><b data-a="pv|${p.id}" style="cursor:pointer">${esc(p.name)}</b>${p.category?`<small class="mu">${esc(p.category)}</small>`:''}<div class="gd" style="font-weight:700">${money(p.price)}</div>${cart[p.id]?`<div class="stp"><button class="b s" data-a="dec|${p.id}">−</button><b>${cart[p.id]}</b><button class="b s" data-a="inc|${p.id}">+</button></div>`:`<button class="b g s" data-a="inc|${p.id}">🛒 Savatga</button>`}</div>`}).join(''):'<div class="card mu">Hech narsa topilmadi</div>'}
function showProd(id){const p=PROD.find(x=>x.id===id);if(!p)return;
 $('#xbody').innerHTML=`<div class="pv"><div style="font-weight:800;font-size:20px;margin-bottom:10px">${esc(p.name)}</div>${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:'<div class="pi" style="aspect-ratio:auto;height:160px">🧴</div>'}${p.category?`<div class="tag" style="display:inline-block;margin-top:10px">${esc(p.category)}</div>`:''}<div class="gd" style="font-size:24px;font-weight:800;margin:10px 0">${money(p.price)}</div>${p.description?`<div class="mu" style="white-space:pre-wrap;margin-bottom:12px">${esc(p.description)}</div>`:''}
 ${cart[id]?`<div class="stp"><button class="b" data-a="vdec|${id}">−</button><b style="font-size:18px">${cart[id]} dona</b><button class="b" data-a="vinc|${id}">+</button></div><div class="mu" style="text-align:right;margin-top:6px">Jami: ${money(cart[id]*p.price)}</div>`:`<button class="b g" style="width:100%;padding:14px" data-a="vinc|${id}">🛒 Savatga qo'shish</button>`}</div>`;
 if(!$('#xdlg').open)$('#xdlg').showModal()}
function showCart(){const L=PROD.filter(p=>cart[p.id]);if(!L.length){$('#xdlg').close();return}
 const tot=L.reduce((s,p)=>s+cart[p.id]*Number(p.price),0);
 $('#xbody').innerHTML=`<b style="font-size:18px">🛒 Savat</b>${L.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="mu">${money(p.price)}</div></div><div class="stp"><button class="b s" data-a="cdec|${p.id}">−</button><b>${cart[p.id]}</b><button class="b s" data-a="cinc|${p.id}">+</button></div></div>`).join('')}
 <div class="row"><b>Jami</b><b class="gd">${money(tot)}</b></div><textarea class="fi" id="cnote" rows="2" maxlength="300" placeholder="Izoh (ixtiyoriy)" style="margin-top:10px;resize:none">${esc(cnote)}</textarea>
 <div class="btns" style="margin-top:10px"><button class="b g" data-a="order">✅ Buyurtma berish</button><button class="b" data-a="cclear">Tozalash</button></div>`;
 if(!$('#xdlg').open)$('#xdlg').showModal()}
document.addEventListener('input',e=>{if(e.target.id==='cnote')cnote=e.target.value;if(e.target.id==='stq'){stQ=e.target.value;$('#pgrid').innerHTML=prodGrid()}});
document.addEventListener('change',e=>{if(e.target.id==='sts'){stSort=e.target.value;$('#pgrid').innerHTML=prodGrid()}});
function draw(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.p===page));
 $('#title').textContent=(shop.name?shop.name+' · ':'')+PAGES.find(p=>p[0]===page)[2];$('#view').innerHTML=V[page]();if(page==='stats')setTimeout(drawCharts,0)}
